minimum_prek_version = "0.3.0"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-merge-conflict" },
  # Lens evidence keeps each runner's raw output, which embeds the case's whole diff.
  { id = "check-added-large-files", exclude = "^review-pr/tests/evidence/" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.21"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "check-skill-frontmatter", name = "Validate SKILL.md frontmatter against agentskills.io spec", language = "python", language_version = "python3", additional_dependencies = ["pyyaml>=6"], entry = "python scripts/check-skill-frontmatter.py", files = "(?:^|/)SKILL\\.md$", pass_filenames = true },
  { id = "release-tree-tests", name = "release: the release-tree builder's own unit suite passes", language = "system", entry = "uv run --with pytest pytest scripts/tests/test_build_release_tree.py -q", files = "^(scripts/(build-release-tree\\.py|tests/test_build_release_tree\\.py)|review-pr/.*)$", pass_filenames = false },
  { id = "check-skill-frontmatter-tests", name = "check-skill-frontmatter: delimiter and field tests", language = "system", entry = "uv run --with pytest --with pyyaml pytest scripts/tests/test_check_skill_frontmatter.py -q", files = "^scripts/(check-skill-frontmatter\\.py|tests/test_check_skill_frontmatter\\.py)$", pass_filenames = false },
  { id = "review-pr-validate", name = "review-pr: input and prerequisite validation", language = "system", entry = "bash review-pr/tests/validate-test.sh", files = "^review-pr/(scripts/.*|tests/validate-test\\.sh)$", pass_filenames = false },
  { id = "review-pr-isolate-policy", name = "review-pr: policy restored from base, hooks stripped", language = "system", entry = "bash review-pr/tests/isolate-policy-test.sh", files = "^review-pr/(scripts/.*|tests/isolate-policy-test\\.sh)$", pass_filenames = false },
  { id = "review-pr-deepen", name = "review-pr: deepen reaches the merge base of a >50-commit PR", language = "system", entry = "bash review-pr/tests/deepen-test.sh", files = "^review-pr/(scripts/.*|tests/deepen-test\\.sh)$", pass_filenames = false },
  { id = "review-pr-validate-result", name = "review-pr: result validator implements the lens contract", language = "system", entry = "bash review-pr/tests/validate-result-test.sh", files = "^review-pr/(scripts/validate-result\\.sh|tests/validate-result-test\\.sh)$", pass_filenames = false },
  { id = "review-pr-run-child", name = "review-pr: runner lifecycle, watchdog, cleanup", language = "system", entry = "bash review-pr/tests/run-child-test.sh", files = "^review-pr/(scripts/.*|tests/run-child-test\\.sh)$", pass_filenames = false },
  { id = "review-pr-wrapper", name = "review-pr: public wrapper and scratch ownership", language = "system", entry = "bash review-pr/tests/review-pr-test.sh", files = "^review-pr/(SKILL\\.md|scripts/.*|tests/review-pr-test\\.sh)$", pass_filenames = false },
  { id = "review-pr-adapter-contract", name = "review-pr: adapter interface and generic-core boundary", language = "system", entry = "bash review-pr/tests/adapter-contract-test.sh", files = "^review-pr/(SKILL\\.md|references/.*|scripts/.*|tests/adapter-contract-test\\.sh)$", pass_filenames = false },
  { id = "review-pr-codex-adapter", name = "review-pr: Codex adapter flags and normalization", language = "system", entry = "bash review-pr/tests/codex-adapter-test.sh", files = "^review-pr/(references/runner-contract\\.md|references/runners/codex\\.md|scripts/adapters/codex\\.sh|scripts/adapters/supported|scripts/lib\\.sh|tests/(codex-adapter-test|lens-fixture-test)\\.sh)$", pass_filenames = false },
  { id = "review-pr-lens-score", name = "review-pr: manifest-driven lens quality gate", language = "system", entry = "python3 review-pr/tests/lens-score-test.py", files = "^review-pr/(scripts/validate-result\\.sh|references/review-lens\\.md|tests/(score-lens\\.py|lens-score-test\\.py|lens-fixture-test\\.sh|lens-rubric\\.md|lens-cases/.*|evidence/lens/.*))$", pass_filenames = false },
  { id = "review-pr-lens-cost", name = "review-pr: lens cost report parses both runners' native output", language = "system", entry = "python3 review-pr/tests/lens-cost-test.py", files = "^review-pr/tests/(lens-cost|lens-cost-test)\\.py$", pass_filenames = false },
  { id = "review-pr-skill-discovery-probe", name = "review-pr: native skill discovery probe fails closed", language = "system", entry = "bash review-pr/tests/native-skill-discovery-probe-test.sh", files = "^review-pr/(scripts/(lib|adapters/codex)\\.sh|tests/native-skill-discovery-probe(-test)?\\.sh)$", pass_filenames = false },
  { id = "review-pr-skill-frontmatter", name = "review-pr: skill frontmatter grammar fails closed", language = "system", entry = "bash review-pr/tests/skill-frontmatter-test.sh", files = "^(review-pr/(scripts/lib\\.sh|tests/skill-frontmatter-test\\.sh)|.*/SKILL\\.md)$", pass_filenames = false },
  { id = "review-pr-prose-length", name = "review-pr: prose-length measure parses the report grammar", language = "system", entry = "python3 review-pr/tests/prose-length-test.py", files = "^review-pr/(references/review-lens\\.md|tests/(prose-length|prose-length-test)\\.py)$", pass_filenames = false },
  { id = "review-pr-lens-collection", name = "review-pr: immutable case snapshot collections", language = "system", entry = "bash review-pr/tests/lens-collection-test.sh", files = "^review-pr/(scripts/.*|references/review-lens\\.md|tests/(score-lens\\.py|lens-cost\\.py|lens-rubric\\.md|lens-(fixture|collection)-test\\.sh|lens-cases/.*|evidence/lens/(cases|diagnostics)/.*))$", pass_filenames = false },
  { id = "review-pr-lens-evidence", name = "review-pr: replay manifest-scored evidence", language = "system", entry = "bash review-pr/tests/lens-evidence-test.sh", files = "^review-pr/(scripts/(adapters/supported|validate-result\\.sh)|references/review-lens\\.md|tests/(score-lens\\.py|lens-rubric\\.md|lens-fixture-test\\.sh|lens-evidence-test\\.sh|lens-cases/.*|evidence/lens/.*))$", pass_filenames = false },
  { id = "review-pr-shellcheck", name = "review-pr: shellcheck", language = "system", entry = "shellcheck", files = "^review-pr/.*\\.sh$", pass_filenames = true },
]
