version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # `dev` is where work lands; `main` is the generated runtime tree.
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
